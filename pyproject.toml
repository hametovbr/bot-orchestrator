[project]
name = "bot-orchestrator"
version = "0.3.0"
description = "Self-hosted web panel for running many Telegram bots on one local Bot API server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.12",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Request timeouts on async methods are intentional; quick pathlib calls are fine here.
ignore = ["ASYNC109", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
