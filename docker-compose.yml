# The whole stack: local Bot API server, orchestrator (web UI) and runner.
# Usage: cp .env.example .env, fill it in, then `docker compose up -d`.
# Adding bots never requires editing this file.
#
# Only the orchestrator publishes a port. The Bot API server and the runner are
# reachable from the other containers only.

services:
  # Makes the shared volumes writable for uid 101 (the user of all three images),
  # whichever container happens to create them first.
  volume-init:
    image: busybox:1.36
    command: chown 101:101 /files /data /packages
    volumes:
      - bot-files:/files
      - orchestrator-data:/data
      - runner-packages:/packages

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    depends_on:
      volume-init: { condition: service_completed_successfully }
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
      # Handlers send files by local path: ctx.api.send_document(document=Path(...)).
      - bot-files:/files:ro

  bot-runner:
    image: ghcr.io/hametovbr/bot-runner:latest
    restart: unless-stopped
    depends_on:
      volume-init: { condition: service_completed_successfully }
    environment:
      RUNNER_SECRET: ${RUNNER_SECRET:?set RUNNER_SECRET in .env}
      HANDLER_TIMEOUT: ${HANDLER_TIMEOUT:-60}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-3600}
      HANDLER_MEMORY_MB: ${HANDLER_MEMORY_MB:-1024}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-8}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-2}
      TZ: ${TZ:-UTC}
      # Environment variables for handlers: BOTENV_<NAME> becomes <NAME> in every
      # handler, background task and ctx.shell program (os.environ["<NAME>"]).
      # Same for all bots; use per-bot secrets (ctx.secrets) for passwords and keys.
      # BOTENV_WEATHER_API_URL: https://api.example.com
    volumes:
      - bot-files:/files
      - bot-api-data:/var/lib/telegram-bot-api
      # Read-only files handlers may use, e.g. cookies for ctx.download.
      - ./shared:/shared:ro
      # Extra Python packages from the Packages page.
      - runner-packages:/packages
    mem_limit: 4g
    cpus: 2

  bot-orchestrator:
    image: ghcr.io/hametovbr/bot-orchestrator:latest
    restart: unless-stopped
    depends_on:
      volume-init: { condition: service_completed_successfully }
      telegram-bot-api: { condition: service_started }
      bot-runner: { condition: service_started }
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      RUNNER_SECRET: ${RUNNER_SECRET:?set RUNNER_SECRET in .env}
      UPDATE_RETENTION_DAYS: ${UPDATE_RETENTION_DAYS:-14}
      BOT_CONCURRENCY: ${BOT_CONCURRENCY:-4}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TZ: ${TZ:-UTC}
      TASK_CONCURRENCY: ${TASK_CONCURRENCY:-2}
      CACHE_RETENTION_HOURS: ${CACHE_RETENTION_HOURS:-24}
      DISK_WARNING_PERCENT: ${DISK_WARNING_PERCENT:-90}
      # Keep these above the runner's HANDLER_TIMEOUT and TASK_TIMEOUT.
      RUNNER_REQUEST_TIMEOUT: ${RUNNER_REQUEST_TIMEOUT:-180}
      TASK_REQUEST_TIMEOUT: ${TASK_REQUEST_TIMEOUT:-7200}
    volumes:
      - orchestrator-data:/data
      - bot-files:/files
      - bot-api-data:/var/lib/telegram-bot-api
    ports:
      - ${ORCHESTRATOR_BIND:-127.0.0.1:8000}:8000

volumes:
  bot-api-data:
  bot-files:
  orchestrator-data:
  runner-packages:
