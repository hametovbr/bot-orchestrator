<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bot Orchestrator{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Bot Orchestrator</a>
    {% if request.session.get("auth") %}
    <nav class="topnav">
      <a href="/" class="{% if request.url.path == '/' or request.url.path.startswith('/bots') %}active{% endif %}">Bots</a>
      <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Settings</a>
      <form method="post" action="/logout"><button class="link">Log out</button></form>
    </nav>
    {% endif %}
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% for m in messages %}
    <div class="flash flash-{{ m.kind }}">{{ m.text }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">bot-orchestrator {{ version }}</footer>
  <script src="/static/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
